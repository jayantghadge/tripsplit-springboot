# Production profile: same MongoDB stack, values come from Render env vars.
# Required env vars on Render: MONGODB_URI, JWT_SECRET, CORS_ALLOWED_ORIGINS
# Render injects PORT automatically.
spring:
  application:
    name: tripsplit
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
