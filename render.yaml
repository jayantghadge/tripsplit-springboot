services:
  - type: web
    name: tripsplit-backend
    runtime: java
    plan: free
    buildCommand: chmod +x gradlew && ./gradlew build -x test
    startCommand: java -jar build/libs/tripsplit-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Optional: set to "prod" to use application-prod.yml (requires all vars above)
      # - key: SPRING_PROFILES_ACTIVE
      #   value: prod
